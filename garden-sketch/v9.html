<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ładowanie Szkicu ogrodu…</title><style>html,body{margin:0;min-height:100%;display:grid;place-items:center;background:#153d35;color:#fff;font-family:system-ui}#loading{padding:24px;text-align:center}</style></head><body><div id="loading">Uruchamianie poprawionej wersji pomiaru…</div><script>
(async()=>{
 const response=await fetch('./v8.html?base=v9',{cache:'no-store'});
 if(!response.ok)throw new Error('Nie można pobrać aplikacji');
 let html=await response.text();
 const css=`<style id="ekoos-v9-fix">
 @media (max-width:700px) and (orientation:portrait){

 }
 </style>`;
 const patch='<scr'+'ipt>(()=>{\n'+
 `const EKOOS_MIN_DOWN=-0.035;\n`+
 `function ekoosPlaceReticle(){const sheet=document.querySelector('.ar-sheet'),ret=document.querySelector('.reticle');if(!sheet||!ret)return;const sheetTop=sheet.getBoundingClientRect().top;const preferred=innerHeight*.52;const safe=sheetTop-92;const y=Math.max(innerHeight*.30,Math.min(preferred,safe));ret.style.top=y+'px';}\n`+
 `addEventListener('resize',ekoosPlaceReticle,{passive:true});addEventListener('orientationchange',()=>setTimeout(ekoosPlaceReticle,250),{passive:true});const sh=document.querySelector('.ar-sheet');if(sh&&window.ResizeObserver)new ResizeObserver(ekoosPlaceReticle).observe(sh);setTimeout(ekoosPlaceReticle,100);\n`+
 `if(typeof groundProjection==='function'){groundProjection=function(view){if(groundY==null&&pts&&pts.length&&Number.isFinite(pts[0].wy))groundY=pts[0].wy;if(groundY==null||!view)return null;const m=view.transform.matrix,o={x:m[12],y:m[13],z:m[14]};let dx=-m[8],dy=-m[9],dz=-m[10];const horizontal=Math.hypot(dx,dz);if(horizontal<.0001)return null;if(dy>EKOOS_MIN_DOWN)dy=EKOOS_MIN_DOWN;const len=Math.hypot(dx,dy,dz);dx/=len;dy/=len;dz/=len;let t=(groundY-o.y)/dy;if(!Number.isFinite(t)||t<=0)return null;t=Math.min(t,70);return{x:o.x+dx*t,y:-o.z-dz*t,wx:o.x+dx*t,wy:groundY,wz:o.z+dz*t,projected:true};};}\n`+
 `if(typeof addHit==='function'){const originalAddHit=addHit;addHit=function(){if(hit&&groundY==null&&Number.isFinite(hit.wy))groundY=hit.wy;const result=originalAddHit.apply(this,arguments);setTimeout(ekoosPlaceReticle,0);return result;};}\n`+
 `const originalStart=document.querySelector('#startAr');if(originalStart)originalStart.addEventListener('click',()=>{setTimeout(ekoosPlaceReticle,250);setTimeout(ekoosPlaceReticle,800);});\n`+
 `const info=document.querySelector('.hint');if(info)info.textContent='Po pierwszym punkcie linijka pozostaje aktywna również wtedy, gdy kamera chwilowo nie widzi gruntu.';\n`+
 `})();\n</scr`+'ipt>';
 html=html.replace('</head>',css+'</head>').replace('</body>',patch+'</body>');
