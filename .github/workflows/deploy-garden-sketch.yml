name: Deploy Garden Sketch

on:
  push:
    branches: [main]
    paths:
      - garden-sketch/**
      - .github/workflows/deploy-garden-sketch.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: garden-sketch-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: garden-sketch
      - id: deployment
        uses: actions/deploy-pages@v4
